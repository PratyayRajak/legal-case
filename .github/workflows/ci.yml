name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  SECRET_KEY: "ci-test-secret-key-not-for-production"
  DATABASE_URL: "postgresql://courtuser:courtpass@localhost:5432/courtdb"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy app/ pipeline/ rules/ glossary/
        continue-on-error: true  # Phase 1: mypy allowed to have issues with stubs

  glossary-lint:
    name: Glossary Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run glossary lint
        run: python glossary/lint.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (unit only, no DB needed)
        run: pytest tests/unit/ -v --tb=short --cov=app --cov=pipeline --cov=rules --cov=glossary --cov-report=term-missing

      - name: Check test coverage
        run: pytest tests/unit/ --cov=app --cov=pipeline --cov=rules --cov=glossary --cov-fail-under=50

  rules-validate:
    name: Rules Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml pydantic>=2.7

      - name: Validate rule YAML schemas
        run: python -c "
from pathlib import Path
import yaml
rules_dir = Path('rules/definitions')
for f in rules_dir.glob('*.yaml'):
    with open(f) as fh:
        data = yaml.safe_load(fh)
    print(f'Loaded {f.name}: OK')
print('All rule files valid.')
"
