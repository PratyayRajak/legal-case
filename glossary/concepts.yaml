    surface_forms:
      hi: ["लंबित", "विचाराधीन", "प्रगति पर"]
      en: ["pending", "ongoing", "sub judice", "under consideration"]
    preferred_term:
      hi: "लंबित"
      en: "pending"
    examples:
      - {lang: hi, text: "प्रकरण अभी भी लंबित है।", maps_to: STATUS_PENDING}
      - {lang: en, text: "Matter is pending before the court.", maps_to: STATUS_PENDING}
    not_to_be_confused_with: []
    disambiguation: ""
    review: {reviewed_by: null, reviewed_on: null, status: PLACEHOLDER}

  - concept_id: STATUS_STAYED
    category: case_status
    definition_en: "Court proceedings are temporarily halted by an order."
    definition_hi: "न्यायालय की कार्यवाही अस्थायी रूप से आदेश द्वारा रोकी गई है।"
    surface_forms:
      hi: ["स्थगित", "स्थगन", "रोक"]
      en: ["stayed", "stay order", "suspended", "halted"]
    preferred_term:
      hi: "स्थगित"
      en: "stayed"
    examples:
      - {lang: hi, text: "कार्यवाही स्थगित की जाती है।", maps_to: STATUS_STAYED}
