    not_to_be_confused_with: [STATUS_PENDING]
    disambiguation: "STATUS_STAYED is an active legal hold. STATUS_PENDING is simply ongoing without a hold."
    review: {reviewed_by: null, reviewed_on: null, status: PLACEHOLDER}

