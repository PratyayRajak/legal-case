concepts:
  - concept_id: STATUS_REJECTED
    category: case_status
    definition_en: "The application/petition was dismissed or refused by the court."
    definition_hi: "न्यायालय द्वारा आवेदन/याचिका अस्वीकार या खारिज कर दी गई।"
    surface_forms:
      hi: ["खारिज", "निरस्त", "अस्वीकृत", "नामंजूर"]
      en: ["dismissed", "rejected", "refused", "declined"]
    preferred_term:
      hi: "खारिज"
      en: "rejected"
    examples:
      - {lang: hi, text: "आवेदन खारिज किया जाता है।", maps_to: STATUS_REJECTED}
      - {lang: en, text: "The petition is hereby dismissed.", maps_to: STATUS_REJECTED}
    not_to_be_confused_with: [STATUS_DISPOSED, STATUS_WITHDRAWN]
    disambiguation: "खारिज refers to rejection on merits or non-compliance. Distinguish from STATUS_DISPOSED (resolved on merits with final order) and STATUS_WITHDRAWN (petitioner withdrew)."
    review: {reviewed_by: null, reviewed_on: null, status: PLACEHOLDER}

  - concept_id: STATUS_DISPOSED
    category: case_status
    definition_en: "The case has been fully resolved with a final order."
    definition_hi: "मामला अंतिम आदेश के साथ पूरी तरह निपटाया गया।"
    surface_forms:
      hi: ["निस्तारित", "निपटारा", "समाप्त"]
      en: ["disposed", "disposed of", "resolved", "concluded", "decided"]
    preferred_term:
      hi: "निस्तारित"
      en: "disposed"
    examples:
      - {lang: hi, text: "प्रकरण निस्तारित किया जाता है।", maps_to: STATUS_DISPOSED}
      - {lang: en, text: "Case disposed of.", maps_to: STATUS_DISPOSED}
    not_to_be_confused_with: [STATUS_REJECTED]
    disambiguation: "STATUS_DISPOSED means concluded. STATUS_REJECTED means refused."
    review: {reviewed_by: null, reviewed_on: null, status: PLACEHOLDER}

  - concept_id: STATUS_PENDING
